name: CI/CD Pipeline

on:
  push:
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Configure git for HTTPS dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format Check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit Tests with Coverage Gate (>=80%)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Prepare Artifact
        run: |
          mkdir -p release
          cp -r dist release/
          cp package.json release/
          cp package-lock.json release/
          cp index.html release/
          cp vite.config.mjs release/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shortbox-react-build
          path: release/

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shortbox-react-coverage
          path: coverage/

      - name: Validate Sonar token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN secret is not configured."
            exit 1
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@016cabf6b1b8487c6d4a31ebf2d0a441e5177541
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
